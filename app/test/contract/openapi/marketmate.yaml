      required: [sellerNumber, userId, articles]

    OrganizationStatistics:

      type: object

      description: Aggregated organization-wide statistics across owned markets (KAN-273).

      properties:

        organizationId:

          type: string

        marketsByStatus:

          type: object

          description: Number of owned markets per market status.

