          type: string

        url:

          type: string

          format: uri

        snapshotDate:

          type: string

          description: ISO date (YYYY-MM-DD) when the cited source was captured.

          pattern: '^\d{4}-\d{2}-\d{2}$'

        description:

          type: string

      required: [id, url, snapshotDate, description]

    RegionMappingMetadata:

      description: Metadata block describing the region mapping artifact.

      type: object

      properties:

        schemaVersion:

          type: integer

          minimum: 1

        generatedBy:

          type: string

        generatedAt:

          type: string

          description: ISO date (YYYY-MM-DD) when the artifact was last regenerated.

          pattern: '^\d{4}-\d{2}-\d{2}$'

        fixiertAm:

          nullable: true

          type: string

          description: ISO date (YYYY-MM-DD) when the mapping was locked after review, or `null` when still under review.

          pattern: '^\d{4}-\d{2}-\d{2}$'

        formatNote:

          type: string

        numberingPolicy:

          type: object

          additionalProperties:

            type: string

          description: Policy strings explaining how each block of the v2 unified code was numbered.

        sources:

          type: array

          items:

            $ref: '#/components/schemas/RegionMappingSource'

      required: [schemaVersion, generatedBy, generatedAt, formatNote, numberingPolicy, sources]

    RegionMappingState:

      description: One federal state in the v2 region mapping.

      type: object

      properties:

        bundeslandNr:

          type: string

          pattern: '^\d{2}$'

          description: Internal two-digit federal-state number used inside the v2 unified code.

        officialCode:

          type: string

          pattern: '^\d{2}$'

          description: Official Destatis federal-state code (currently identical to `bundeslandNr`).

        klartextName:

          type: string

      required: [bundeslandNr, officialCode, klartextName]

    RegionMappingEntry:

      description: One district, county-free city, or city-state borough in the v2 region mapping.

      type: object

      properties:

        bundeslandNr:

          type: string

          pattern: '^\d{2}$'

        landkreisNr:

          type: string

          pattern: '^\d{2}$'

          description: Two-digit number unique inside its federal state.

        officialCode:

          nullable: true

          type: string

          description: Official source code when available, otherwise `null`.

        klartextName:

          type: string

        kategorie:

          $ref: '#/components/schemas/RegionMappingCategory'

        source:

          type: string

          description: Identifier referencing one of the entries inside `metadata.sources`.

      required: [bundeslandNr, landkreisNr, klartextName, kategorie, source]

    RegionMappingDocument:

      description: Top-level region mapping document returned by the admin review endpoint.

      type: object

      properties:

        metadata:

          $ref: '#/components/schemas/RegionMappingMetadata'

        states:

          type: array

          items:

            $ref: '#/components/schemas/RegionMappingState'

        entries:

          type: array

          items:

            $ref: '#/components/schemas/RegionMappingEntry'

      required: [metadata, states, entries]
