          type: string

        email:

          type: string


        name:

          type: string

        role:

          $ref: '#/components/schemas/UserRole'

        organizationId:

          type: string

          nullable: true

        bundeslandNr:

          type: integer

          minimum: 1

          maximum: 99

          nullable: true

          description: Internal federal-state number assigned during seller onboarding.

        landkreisNr:

          type: integer

          minimum: 1

          maximum: 99

          nullable: true

          description: Internal district number within the federal state.

        shardNr:

          type: integer

          minimum: 1

          maximum: 999

          nullable: true

          description: Internal shard number within the district.

        sellerNr:

