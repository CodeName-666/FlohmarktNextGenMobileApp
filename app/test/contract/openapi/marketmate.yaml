        zones:

          type: array

          items:

            $ref: '#/components/schemas/ZonenPlanZone'

      required: [lineNumber, zones]

    ZonenPlan:

      type: object

      properties:

        version:

          type: integer

          minimum: 1

        generatedAt:

          type: string

          format: date-time

        variant:

          $ref: '#/components/schemas/RuecksortierVariante'

        lines:

          type: array

          items:

            $ref: '#/components/schemas/ZonenPlanLine'

      required: [version, generatedAt, variant, lines]

    CompanyInfo:

      type: object

