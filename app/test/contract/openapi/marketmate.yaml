        used by the desktop and mobile registers to sell offline. The JSON body is sent
        gzip-compressed (`Content-Encoding: gzip`). `checksum` is the SHA-256 of the
        canonical body without `checksum` (sorted keys, compact separators). A frozen
        market yields byte-identical bodies until it changes.
