openapi: 3.1.0

info:

  title: MarketMate API

  version: 1.7.0

  description: |

    Public REST API for the MarketMate platform. The specification mirrors the existing Express

    backend (`src/backend`) and the shared domain models (`src/frontend/src/lib/types.ts`).

    

    The frontend consumes the standalone backend service through `/api/v1`.

    Use this document as the single source of truth for generating

    clients and server stubs.

  contact:

    name: MarketMate Engineering

servers:

  - url: /api/v1

    description: Same-origin frontend/backend path

  - url: http://localhost:5500/api/v1

    description: Local development server

paths:

  /notifications:
    get:
      summary: List the authenticated account's personal in-app notices
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: beforeId
          in: query
          description: Exclusive id cursor returned as nextBeforeId by the previous page.
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Newest-first personal notices; unreadCount covers the entire account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: Invalid cursor, filter or page size.
        '401':
          description: Authentication required.

  /notifications/read-all:
    post:
      summary: Mark own notices read up to the loaded snapshot boundary
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationReadAllRequest'
      responses:
        '204':
          description: Acknowledged; notices arriving after throughId remain unread.
        '400':
          description: Invalid or missing snapshot boundary.
        '401':
          description: Authentication required.

  /notifications/{notificationId}/read:
    post:
      summary: Idempotently mark a single own-account notice read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Notice acknowledged, including an already-read notice.
        '400':
          description: Invalid notification id.
        '401':
          description: Authentication required.
        '404':
          description: Missing or foreign notice; both cases are indistinguishable.

  /health:

    get:

      summary: Service health-check

      operationId: getHealth

      responses:

        '200':

          description: Service is healthy

          content:

            application/json:

              schema:

                type: object

                properties:

                  status:

                    type: string

                    example: ok

        '500':

          $ref: '#/components/responses/InternalServerError'

  /system/status:

    get:

      summary: Retrieve operational readiness and build metadata

      operationId: getSystemStatus

      responses:

        '200':

          description: Backend and database are ready

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SystemStatus'

        '503':

          description: Backend is running but its database is unavailable

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SystemStatus'

  /legal/privacy-contact:

    get:

      summary: Retrieve GDPR privacy contact information

      operationId: getPrivacyContact

      responses:

        '200':

          description: Configured privacy contact address

          content:

            application/json:

              schema:

                type: object

                properties:

                  contactEmail:

                    type: string


                    nullable: true

                    description: Configured privacy contact email or null when not set.

                  isConfigured:

                    type: boolean

                    description: Indicates whether a privacy contact email is configured.

                required:

                  - contactEmail

                  - isConfigured

                example:

                  contactEmail: datenschutz@market-mate.de

                  isConfigured: true

        '500':

          $ref: '#/components/responses/InternalServerError'

  /legal/company-info:

    get:

      summary: Retrieve company master data for legal disclosures

      operationId: getCompanyInfo

      responses:

        '200':

          description: Company data including contact, address, and legal details

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/CompanyInfo'

              example:

                company:

                  name: MarketMate Solutions UG (haftungsbeschränkt)

                  legalForm: UG (haftungsbeschränkt)

                  managingDirector: Jana Weber

                  foundedYear: 2023

                address:

                  street: Musterstraße 12

                  postalCode: "10115"

                  city: Berlin

                  country: Deutschland

                contact:

                  supportEmail: support@market-mate.de

                  supportPhone: "+49 (0)30 1234 5670"

                  customerSuccessEmail: info@market-mate.de

                  dataProtectionEmail: datenschutz@market-mate.de

                  generalInquiryEmail: info@market-mate.de

                legal:

                  registrationCourt: Amtsgericht Berlin-Charlottenburg

                  registrationNumber: HRB 123456 B

                  vatId: DE123456789

                  responsiblePerson: Jana Weber

                support:

                  businessHours: Montag bis Freitag, 09:00–17:00 Uhr (MEZ)

                  responseTimes:

                    default: Antwort innerhalb von 24 Stunden an Werktagen

                    priority: Antwort innerhalb von 8 Stunden an Werktagen

                onlineDisputeResolution: "https://ec.europa.eu/consumers/odr/"

        '500':

          $ref: '#/components/responses/InternalServerError'

  /config/public:

    get:

      summary: Retrieve public non-sensitive frontend defaults

      operationId: getPublicConfig

      responses:

        '200':

          description: Public market and article-field defaults

          headers:

            Cache-Control:

              description: Moderate public cache hint for bootstrap defaults.

              schema:

                type: string

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/PublicConfig'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /public/markets:
    get:
      summary: Discover publicly visible markets without authentication
      operationId: listPublicMarkets
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: kind
          schema:
            $ref: '#/components/schemas/MarketKind'
        - in: query
          name: cityOrPostcode
          schema:
            type: string
        - in: query
          name: radiusKm
          description: Radius in kilometres around the resolved cityOrPostcode; requires an unambiguous location.
          schema:
            type: number
            minimum: 1
            maximum: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Public-safe paginated market discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMarketList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/markets/{organizationSlug}/{marketSlug}:
    get:
      summary: Retrieve one public-safe market presentation
      operationId: getPublicMarket
      parameters:
        - in: path
          name: organizationSlug
          required: true
          schema:
            type: string
        - in: path
          name: marketSlug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public-safe market presentation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMarket'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /price-suggestions:
    get:
      summary: Suggest a listing price from comparable completed sales
      operationId: getPriceSuggestion
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: size
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Median price suggestion or an empty suggestion below the sample threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:

    post:

      summary: Register user account

      operationId: registerUser

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/RegisterRequest'

      responses:

        '201':

          description: User registered successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthResponse'

        '400':

          description: Validation error (missing payload or required fields)

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '409':

          description: Email already registered

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /auth/login:

    post:

      summary: Authenticate user credentials

      operationId: loginUser

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/LoginRequest'

      responses:

        '200':

          description: Authentication successful

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthResponse'

        '401':

          description: Invalid email or password

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '423':

          description: Account temporarily locked because of too many failed login attempts

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AccountLockedResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /auth/logout:

    post:

      summary: Invalidate the current session token

      operationId: logoutUser

      security:

        - bearerAuth: []

      responses:

        '204':

          description: Session terminated

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /auth/logout-all:
    post:
      summary: Invalidate every session of the calling account
      description: Ends all sessions of the token's owner, including sessions on other devices.
      operationId: logoutAllSessions
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions of the account terminated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:

    get:

      summary: Return details about the authenticated user

      operationId: getCurrentUser

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Authenticated user profile

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthUser'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /users/me/profile:

    patch:

      summary: Update the authenticated user's own name and email

      operationId: updateOwnProfile

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/UpdateOwnProfileRequest'

      responses:

        '200':

          description: Authenticated user profile updated successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthUser'

        '400':

          description: Validation error

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '403':

          description: Email change rejected because the current password is missing or wrong

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '409':

          description: Email already registered

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /users/me/managed-organizations:

    get:

      summary: List the organizations the authenticated user may manage

      description: Returns every organization the caller may manage through a platform admin account, an organization-bound admin account or an owner/admin membership. The website uses it to open the administration console and to offer the organization selection.

      operationId: listOwnManagedOrganizations

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Organizations the authenticated user may manage, sorted by name

          content:

            application/json:

              schema:

                type: array

                items:

                  $ref: '#/components/schemas/ManagedOrganization'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /admin/users:

    get:

      summary: List all users for the admin user management view

      operationId: listAdminUsers

      security:

        - bearerAuth: []

      parameters:

        - in: query

          name: page

          schema:

            type: integer

            minimum: 1

          description: Page number (1-based)

        - in: query

          name: pageSize

          schema:

            type: integer

            minimum: 1

            maximum: 100

          description: Page size

      responses:

        '200':

          description: User collection loaded successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AdminUserListResponse'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '403':

          description: Insufficient permissions

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

    post:

      summary: Create a user through the admin CRUD flow

      operationId: createAdminUser

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/AdminCreateUserRequest'

      responses:

        '201':

          description: User created successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthUser'

        '400':

          description: Validation error

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '403':

          description: Insufficient permissions

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '409':

          description: Email already registered

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /admin/users/{userId}:

    get:

      summary: Load one user for the admin user management view

      operationId: getAdminUserById

      security:

        - bearerAuth: []

      parameters:

        - in: path

          name: userId

          required: true

          schema:

            type: string

      responses:

        '200':

          description: User loaded successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthUser'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '403':

          description: Insufficient permissions

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '404':

          description: User not found

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

    patch:

      summary: Update mutable fields of one user through the admin CRUD flow

      operationId: updateAdminUser

      security:

        - bearerAuth: []

      parameters:

        - in: path

          name: userId

          required: true

          schema:

            type: string

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/AdminUpdateUserRequest'

      responses:

        '200':

          description: User updated successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthUser'

        '400':

          description: Validation error

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '403':

          description: Insufficient permissions

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '404':

          description: User not found

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '409':

          description: Email already registered

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

    delete:

      summary: Delete one user through the admin CRUD flow

      operationId: deleteAdminUser

      security:

        - bearerAuth: []

      parameters:

        - in: path

          name: userId

          required: true

          schema:

            type: string

      responses:

        '204':

          description: User deleted successfully

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '403':

          description: Insufficient permissions

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '404':

          description: User not found

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /auth/verify-email:

    get:

      summary: Verify an email address using a verification token

      operationId: verifyEmail

      parameters:

        - in: query

          name: token

          required: true

          schema:

            type: string

        - in: query

          name: role

          required: false

          schema:

            $ref: '#/components/schemas/UserRole'

      responses:

        '303':

          description: Redirects the browser back to the appropriate frontend login page

        '500':

          $ref: '#/components/responses/InternalServerError'

  /auth/resend-verification:

    post:

      summary: Re-send the verification email for the authenticated user

      operationId: resendVerificationEmail

      security:

        - bearerAuth: []

      responses:

        '202':

          description: Verification email queued

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MessageResponse'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /auth/password/reset-request:

    post:

      summary: Request a password reset link

      operationId: requestPasswordReset

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/PasswordResetRequest'

      responses:

        '202':

          description: Reset request accepted

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MessageResponse'

        '400':

          description: Invalid request payload

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /auth/password/reset:

    post:

      summary: Reset password using a reset token

      operationId: resetPasswordWithToken

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/PasswordResetConfirm'

      responses:

        '200':

          description: Password updated successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MessageResponse'

        '400':

          description: Invalid or expired password reset token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /communications/email:

    post:

      summary: Send an informational email to a recipient

      operationId: sendInformationalEmail

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/InformationalEmailRequest'

      responses:

        '202':

          description: Email accepted for delivery

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MessageResponse'

        '400':

          description: Invalid request payload

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '401':

          description: Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '403':

          description: Insufficient permissions

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /markets/{marketId}/communications/email:

    post:

      summary: Email one or all sellers of a market (KAN-265 follow-up)

      operationId: sendMarketEmail

      security:

        - bearerAuth: []

      parameters:

        - $ref: '#/components/parameters/MarketId'

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/MarketEmailRequest'

      responses:

        '202':

          description: Emails accepted for delivery

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MarketEmailResult'

        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /markets/{marketId}/seller-statistics:
    get:
      summary: Statistics scoped to the authenticated seller
      operationId: getSellerStatistics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Seller-scoped market statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /markets/{marketId}/statistics:

    get:

      summary: Aggregated MVP statistics for one market (KAN-273)

      operationId: getMarketStatistics

      security:

        - bearerAuth: []

      parameters:

        - $ref: '#/components/parameters/MarketId'

      responses:

        '200':

          description: Aggregated market statistics

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MarketStatistics'

        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /markets/{marketId}/table-bookings:
    get:
      summary: List every table booking for an organizer
      operationId: listTableBookings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Table bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableBookingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Immediately confirm one available table and optional equipment
      operationId: createTableBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableBookingRequest'
      responses:
        '201':
          description: Immediately confirmed booking with immutable price snapshots
          content:
            application/json:
