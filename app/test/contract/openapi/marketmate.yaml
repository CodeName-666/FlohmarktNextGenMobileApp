    MarketDailySalesSummaryRequest:

      type: object

      description: |
        Refresh the requested UTC calendar day's totals from the server sales journal
        across all registers. Client figures remain accepted for older clients but do
        not replace the market-wide totals. Upload sales first. Repeating the call is
        idempotent for an unchanged journal and writes a new audit entry.

      properties:

        marketDay:

          type: string

          format: date

          description: Calendar day the aggregate refers to (`YYYY-MM-DD`).

        totalRevenueCents:

          type: integer

          minimum: 0

          description: Total revenue in euro-cents across the market day.

        salesCount:

