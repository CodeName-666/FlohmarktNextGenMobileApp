              type: string


            supportPhone:

              type: string

            customerSuccessEmail:

              type: string


            dataProtectionEmail:

              type: string


            generalInquiryEmail:

              type: string


          required: [supportEmail, supportPhone, dataProtectionEmail]

        legal:

          type: object

          properties:

            registrationCourt:

              type: string

            registrationNumber:

              type: string

            vatId:

              type: string

            responsiblePerson:

              type: string

          required: [registrationCourt, registrationNumber, responsiblePerson]

        support:

          type: object

          properties:

            businessHours:

              type: string

            responseTimes:

              type: object

              properties:

                default:

                  type: string

                priority:

                  type: string

          required: [businessHours]

        onlineDisputeResolution:

          type: string


      required:

