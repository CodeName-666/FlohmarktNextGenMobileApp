        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/markets/{marketId}/purchases:

    post:

      summary: Create purchase (seller number)

      operationId: createPurchase

      security:

        - bearerAuth: []

      parameters:

        - $ref: '#/components/parameters/UserId'

        - $ref: '#/components/parameters/MarketId'

      responses:

        '201':

          description: Purchase created

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Purchase'

        '404':

          $ref: '#/components/responses/NotFound'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '409':

          description: Purchase cannot be completed due to limits or full capacity

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '412':

          description: Seller region precondition is not fulfilled

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /markets/{marketId}/stammnummern:

    get:

      summary: List Stammnummer availability for a market

      operationId: listMarketStammnummern

      security:

        - bearerAuth: []

      parameters:

        - $ref: '#/components/parameters/MarketId'

      responses:

        '200':

          description: Stammnummer availability for the market

          content:

            application/json:

              schema:

                type: array

                items:

                  $ref: '#/components/schemas/StammnummerStatus'

        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '404':

          $ref: '#/components/responses/NotFound'

        '500':

          $ref: '#/components/responses/InternalServerError'

    post:

      summary: Reserve a requested Stammnummer for the authenticated seller

      operationId: reserveMarketStammnummer

      security:

        - bearerAuth: []

      parameters:

        - $ref: '#/components/parameters/MarketId'

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/StammnummerReservationRequest'

      responses:

        '201':

          description: Stammnummer reserved

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Purchase'

        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '409':

          description: Stammnummer cannot be reserved due to first-come conflict or limits

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '412':

          description: Seller region precondition is not fulfilled

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /purchases/{purchaseId}/box-label.pdf:
    get:
      operationId: getPurchaseBoxLabelPdf
      summary: Download an A4 box label for a booked Stammnummer
      description: >-
        Read-only PDF with the existing market-local Stamm-/Boxnummer, complete
        permanent seller identity, seller name, market name and date. Reprinting
        does not allocate a number. Available to the booking owner, the market's
        organizers and authorized administrators, including after market freeze.
        No physical box registration or tracking is involved.
      security:
        - bearerAuth: []
      parameters:
        - name: purchaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One A4 page for the booked Stammnummer
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename identifying market and Stammnummer
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Seller has no complete valid permanent identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /purchases/{purchaseId}:

    delete:

      summary: Release a Stammnummer reservation

      operationId: deletePurchase

      security:

        - bearerAuth: []

      parameters:

        - $ref: '#/components/parameters/PurchaseId'

      responses:

        '204':

          description: Stammnummer reservation released

        '409':

          description: Stammnummer still has assigned articles and cannot be released

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '423':

          description: Market is frozen for seller changes

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '404':

          $ref: '#/components/responses/NotFound'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /markets/{marketId}/sellers/{sellerNumber}/listings:

    get:

      summary: Search listings for a seller within a market

      operationId: searchListingsForSeller

      parameters:

        - $ref: '#/components/parameters/MarketId'

        - $ref: '#/components/parameters/SellerNumber'

        - name: userId

          in: query

          schema:

            type: string

          description: Optional user id to include unassigned articles owned by the seller

        - name: includeUnassigned

          in: query

          schema:

            type: boolean

          description: When true, includes articles without listings (requires userId)

        - name: targetMarketId

          in: query

          schema:

            type: integer

            minimum: 1

          description: Optional target market filter applied to unassigned articles

        - name: search

          in: query

          schema:

            type: string

          description: Case-insensitive match against title or description

        - name: category

          in: query

          schema:

            type: string

          description: Filters by article category

        - name: size

          in: query

          schema:

            type: string

          description: Filters by article size

        - name: status

          in: query

          style: form

          explode: false

          schema:

            type: array

            items:

              type: string

              enum: [For Sale, Sold]

          description: Comma-separated listing statuses to include

        - name: minPrice

          in: query

          schema:

            type: number

            format: float

            minimum: 0

          description: Minimum price filter (inclusive)

        - name: maxPrice

          in: query

          schema:

            type: number

            format: float

            minimum: 0

          description: Maximum price filter (inclusive)

        - name: sortBy

          in: query

          schema:

            type: string

            enum: [title, price, status]

          description: Sort field

        - name: sortDirection

          in: query

          schema:

            type: string

            enum: [asc, desc]

          description: Sort direction

        - name: page

          in: query

          schema:

            type: integer

            minimum: 1

          description: Page number (1-based)

        - name: pageSize

          in: query

          schema:

            type: integer

            minimum: 1

            maximum: 100

          description: Page size

      responses:

        '200':

          description: Filtered listings for the seller and market

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ListingSearchResult'

        '400':

          $ref: '#/components/responses/BadRequest'

        '409':

          $ref: '#/components/responses/Conflict'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /listings:

    post:

      summary: Create listing

      operationId: createListing

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/CreateListingRequest'

      responses:

        '201':

          description: Listing created

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Listing'

        '400':

          $ref: '#/components/responses/BadRequest'

        '409':

          $ref: '#/components/responses/Conflict'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /listings/bulk:

    post:

      summary: Bulk assign or remove listings

      operationId: bulkUpdateListings

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/BulkListingRequest'

      responses:

        '200':

          description: Bulk listing update result

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/BulkListingResult'

        '400':

          $ref: '#/components/responses/BadRequest'

        '409':

          $ref: '#/components/responses/Conflict'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /listings/status:

    post:

      summary: Bulk update listing status with optimistic locking

      description: |
        Sets listings between `For Sale` and `Sold` in one bulk call. Compare-and-set
        on `fromStatus` enforces optimistic locking so concurrent cash registers cannot
        race the same listing into `Sold` twice. Each update item is reported individually
        in the response body. Re-submitting an update with the same `toStatus` is a
        no-op (idempotent).

      operationId: bulkUpdateListingStatus

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/ListingStatusUpdateRequest'

      responses:

        '200':

          description: Bulk status update result with per-item outcomes (all items applied or no-op).

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ListingStatusUpdateResult'

        '409':

          description: |
            Either the bulk update completed with at least one optimistic-locking conflict
            (`ListingStatusUpdateResult`), or the whole request was rejected because sales
            have started (`ErrorResponse` with code `MARKET_SALES_STARTED`). After the start
            the server derives sold listings from the uploaded sales journal.

          content:

            application/json:

              schema:

                oneOf:
                  - $ref: '#/components/schemas/ListingStatusUpdateResult'
                  - $ref: '#/components/schemas/ErrorResponse'

        '413':

          description: Payload exceeds the maximum allowed number of updates per request.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '422':

          $ref: '#/components/responses/BadRequest'

        '423':

          description: Market is frozen and the caller is not an organizer.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /listings/{listingId}:

    delete:

      summary: Delete listing

      operationId: deleteListing

      security:

        - bearerAuth: []

      parameters:

        - $ref: '#/components/parameters/ListingId'

      responses:

        '204':

          description: Listing deleted

        '400':

          $ref: '#/components/responses/BadRequest'

        '404':

          $ref: '#/components/responses/NotFound'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /sales/batch:

    post:

      summary: Bulk-import sale transactions from the FlohmarktNextGenApp

      description: |
        Accepts a list of sale transactions from one cash register and persists them
        idempotently. Each `vorgangId` is processed independently — the request is
        not atomic. Re-submitting the same batch is safe: known `vorgangId`s yield
        `skipped_duplicate`. Cancellation entries reference the original sale via
        `cancelOf`; a missing original yields `invalid`. A second sale touching a
        `listingId` already linked to another non-cancelled sale yields `conflict`.

      operationId: bulkImportSales

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/BulkSaleRequest'

      responses:

        '200':

          description: Bulk sale import result with per-item outcomes (no conflicts encountered).

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/BulkSaleResult'

        '409':

          description: Bulk sale import completed with at least one `conflict` outcome.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/BulkSaleResult'

        '422':

          $ref: '#/components/responses/BadRequest'

        '423':

          description: Market is frozen and the caller is not an organizer.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /sales/{vorgangId}:

    get:

      summary: Look up a single persisted sale by its vorgangId

      description: |
        Resolves one persisted sale transaction (header and item lines) by its
        `vorgangId`. Used by the cashier to resolve a scanned receipt for a
        complaint, a post-hoc cancellation lookup, or a receipt reprint. Only
        sales of a market the caller holds a role on are visible (market scope).

      operationId: getSaleByVorgangId

      security:

        - bearerAuth: []

      parameters:

        - name: vorgangId

          in: path

          required: true

          schema:

            type: string

          description: UUID v7 idempotency key of the sale to resolve.

      responses:

        '200':

          description: The resolved sale record including its item lines.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Sale'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /markets/{id}/sale-conflicts:

    post:

      summary: Persist a sale conflict referred to the organizer

      description: |
        Stores a sale conflict the cashier could not resolve on the cash register
        ("an Organisator verweisen", APP-1B.1). The persisted conflict gives the
        organizer a market-wide view of unresolved conflicts (BE-1B.7).

      operationId: raiseSaleConflict

      security:

        - bearerAuth: []

      parameters:

        - name: id

          in: path

          required: true

          schema:

            type: integer

          description: Target market identifier.

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/RaiseSaleConflictRequest'

      responses:

        '201':

          description: The persisted sale conflict.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SaleConflict'

        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '500':

          $ref: '#/components/responses/InternalServerError'

    get:

      summary: List sale conflicts of one market for the organizer dashboard

      description: |
        Returns the market's persisted sale conflicts for the organizer conflict
        dashboard (BE-1B.7, organizer-only). Optionally filtered by `status`.

      operationId: listSaleConflicts

      security:

        - bearerAuth: []

      parameters:

        - name: id

          in: path

          required: true

          schema:

            type: integer

          description: Target market identifier.

        - name: status

          in: query

          required: false

          schema:

            $ref: '#/components/schemas/SaleConflictStatus'

          description: Optional filter restricting the result to one conflict status.

      responses:

        '200':

          description: The market's sale conflicts.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SaleConflictList'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /markets/{id}/sale-conflicts/{conflictId}/resolve:

    post:

      summary: Resolve a sale conflict with the organizer's final decision

      description: |
        Records the organizer's final decision on one open sale conflict (BE-1B.7,
        organizer-only). Discarded vorgaenge that are still persisted as active sales
        are cancelled with a synthetic storno; `keep_both_with_note` only annotates.

      operationId: resolveSaleConflict

      security:

        - bearerAuth: []

      parameters:

        - name: id

          in: path

          required: true

          schema:

            type: integer

          description: Target market identifier.

        - name: conflictId

          in: path

          required: true

          schema:

            type: integer

          description: Identifier of the sale conflict to resolve.

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/ResolveSaleConflictRequest'

      responses:

        '200':

          description: The resolved sale conflict.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SaleConflict'

        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '404':

          $ref: '#/components/responses/NotFound'

        '409':

          description: The conflict is already resolved.

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/market-history:

    get:

      summary: Retrieve user market history

      operationId: getMarketHistory

      security:

        - bearerAuth: []

      description: Accessible only to the user themselves and platform administrators.

      parameters:

        - $ref: '#/components/parameters/UserId'

      responses:

        '200':

          description: Chronological market history for the user

          content:

            application/json:

              schema:

                type: array

                items:

                  $ref: '#/components/schemas/MarketHistory'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /region-mapping:

    get:

      summary: Read the committed v2 region mapping artifact

      description: |
        Returns the read-only Bundesland/Landkreis mapping used during seller
        region self-assignment. The endpoint is available to every
        authenticated dashboard user and never mutates state.

      operationId: getRegionMapping

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Region mapping document loaded successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/RegionMappingDocument'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /seller/region:

    post:

      summary: Assign the authenticated seller to one fixed code region

      description: |
        Stores the seller-selected Bundesland and Landkreis once, validates the
        pair against the committed mapping, and allocates the next
        region-scoped shard/seller identity through the backend generator.

      operationId: setSellerRegion

      security:

        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/SellerRegionRequest'

      responses:

        '200':

          description: Seller region identity assigned successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AuthUser'

        '400':

          $ref: '#/components/responses/BadRequest'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '409':

          $ref: '#/components/responses/Conflict'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /admin/region-mapping:

    get:

      summary: Read the committed v2 region mapping artifact

      description: |
        Returns the read-only region mapping document used by Konzept v2.

        The mapping is fixed once before the first release and locked via
        `metadata.fixiertAm`. The endpoint never mutates state.

      operationId: getAdminRegionMapping

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Region mapping document loaded successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/RegionMappingDocument'

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

  /admin/region-mapping.csv:

    get:

      summary: Download the committed region mapping as CSV

      description: |
        Returns the same data as `getAdminRegionMapping` rendered as a
        comma-separated values export. Suitable for offline review.

      operationId: downloadAdminRegionMappingCsv

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Region mapping CSV export

          content:

            text/csv:

              schema:

                type: string

        '401':

          $ref: '#/components/responses/Unauthorized'

        '403':

          $ref: '#/components/responses/Forbidden'

        '500':

          $ref: '#/components/responses/InternalServerError'

components:

  parameters:

    MarketId:

      name: marketId

      in: path

      required: true

      schema:

        type: integer

        minimum: 1

      description: Numeric identifier of a market

    MarketSlug:

      name: slug

      in: path

      required: true

      schema:

        type: string

      description: URL-friendly market slug

    OrganizationId:

      name: organizationId

      in: path

      required: true

      schema:

        type: string

      description: Organization identifier

    AuditLogPage:

      name: page

      in: query

      schema:

        type: integer

        minimum: 1

      description: Page number (1-based)

    AuditLogPageSize:

      name: pageSize

      in: query

      schema:

        type: integer

        minimum: 1

        maximum: 100

      description: Page size

    AuditLogFrom:

      name: from

      in: query

      schema:

        type: string

        format: date-time

      description: Only entries created at or after this ISO-8601 timestamp; timestamps without offset are read as UTC.

    AuditLogTo:

      name: to

      in: query

      schema:

        type: string

        format: date-time

      description: Only entries created at or before this ISO-8601 timestamp; timestamps without offset are read as UTC.

    AuditLogAction:

      name: action

      in: query

      schema:

        type: string

        maxLength: 255

      description: Exact action key (`purchase.cancel`) or action area (`purchase`, matching every `purchase.*` key).

    AuditLogActorId:

      name: actorId

      in: query

      schema:

        type: string

        maxLength: 255

      description: Only entries caused by this user.

    AuditLogMarketId:

      name: marketId

      in: query

      schema:

        type: integer

        minimum: 1

      description: Only entries of this market.

    AuditLogResultFilter:

      name: result

      in: query

      schema:

        $ref: '#/components/schemas/AuditLogResult'

      description: Only entries with this result.

    UserId:

      name: userId

      in: path

      required: true

      schema:

        type: string

      description: User identifier

    ArticleId:

      name: articleId

      in: path

      required: true

      schema:

        type: string

      description: Article identifier (UUID v7 format)

    ListingId:

      name: listingId

      in: path

      required: true

      schema:

        type: string

      description: Listing identifier composed from seller number and article id

    PurchaseId:

      name: purchaseId

      in: path

      required: true

      schema:

        type: string

      description: Purchase identifier

    SellerNumber:

      name: sellerNumber

      in: path

      required: true

      schema:

        type: integer

        minimum: 1

      description: Seller number issued to a participant

    ProfileId:

      name: profileId

      in: path

      required: true

      schema:

        type: string

      description: Identifier of an article field profile

  responses:

    BadRequest:

      description: Invalid request parameters or payload

      content:

        application/json:

          schema:

            $ref: '#/components/schemas/ErrorResponse'

    NotFound:

      description: Requested resource not found

      content:

        application/json:

          schema:

            $ref: '#/components/schemas/ErrorResponse'

    Conflict:

      description: Request conflicts with the current resource state

      content:

        application/json:

          schema:

            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:

      description: Missing or invalid authentication token

      content:

        application/json:

          schema:

            $ref: '#/components/schemas/ErrorResponse'

          examples:

            missingToken:

              value:

                message: Missing authentication token

                error: AUTH_MISSING

            invalidToken:

              value:

                message: Invalid authentication token

                error: AUTH_INVALID

    Forbidden:

      description: Insufficient permissions or missing ownership scope

      content:

        application/json:

          schema:

            $ref: '#/components/schemas/ErrorResponse'

          examples:

            roleDenied:

              value:

                message: Insufficient permissions

                error: RBAC_FORBIDDEN

                details:

                  requiredRoles:

                    - organizer

                  role: helper

            ownershipDenied:

              value:

                message: Resource ownership is required

                error: OWNERSHIP_REQUIRED

    InternalServerError:

      description: Unexpected server error

      content:

        application/json:

          schema:

            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:

    bearerAuth:

      type: http

      scheme: bearer

      bearerFormat: JWT

  schemas:

    MarketExport:
      type: object
      description: Offline market package (schema version 2.0) for the desktop and mobile registers.
      required: [version, export_timestamp, checksum, market, marketParameters, fieldProfile, fees, sellers, articles, stammnummernMapping, listings]
      properties:
        version: { type: string, enum: ['2.0'] }
        export_timestamp: { type: string, format: date-time, description: Frozen markets reuse `frozenAt`. }
        checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        market: { $ref: '#/components/schemas/MarketExportMarket' }
        marketParameters: { $ref: '#/components/schemas/MarketExportParameters' }
        fieldProfile:
          type: object
          required: [articleFields]
          properties:
            articleFields:
              type: array
              items: { $ref: '#/components/schemas/MarketExportArticleField' }
        fees: { $ref: '#/components/schemas/MarketExportFees' }
        sellers:
          type: array
          items: { $ref: '#/components/schemas/MarketExportSeller' }
        articles:
          type: array
          items: { $ref: '#/components/schemas/MarketExportArticle' }
        stammnummernMapping:
          type: array
          items: { $ref: '#/components/schemas/MarketExportStammnummerMapping' }
        listings:
          type: array
          items: { $ref: '#/components/schemas/MarketExportListing' }
    MarketExportMarket:
      type: object
      required: [id, name, date, fieldProfileId, fieldProfileVersion, freezeState, frozenAt, freezeGeneration, exportGeneration]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        date: { type: string }
        fieldProfileId: { type: string }
        fieldProfileVersion: { type: integer }
        freezeState: { $ref: '#/components/schemas/MarketFreezeState' }
        frozenAt: { type: [string, 'null'], format: date-time }
        freezeGeneration: { type: integer, minimum: 0 }
        exportGeneration: { type: integer, minimum: 0 }
    MarketExportParameters:
      type: object
      required: [maxStammnummern, linienAnzahl, maxProLinieK, ruecksortierVariante]
      properties:
        maxStammnummern: { type: [integer, 'null'] }
        linienAnzahl: { type: [integer, 'null'] }
        maxProLinieK:
          type: array
          description: Capacity per line, ordered by line number.
          items: { type: integer }
        ruecksortierVariante: { $ref: '#/components/schemas/RuecksortierVariante' }
    MarketExportArticleField:
      type: object
      required: [id, label, type]
      properties:
        id: { type: string }
        label: { type: string }
        type: { $ref: '#/components/schemas/ArticleFieldType' }
    MarketExportFees:
      type: object
      description: Fees in euros as configured on the market; registers convert to integer cents.
      required: [sellerFeeFlat, sellerFeePerStammnummer, revenueSharePercent]
      properties:
        sellerFeeFlat: { type: [number, 'null'] }
        sellerFeePerStammnummer: { type: [number, 'null'] }
        revenueSharePercent: { type: [number, 'null'] }
    MarketExportSeller:
      type: object
      required: [sellerNumber, userId, displayName, regionPrefix]
      properties:
        sellerNumber: { type: integer }
        userId: { type: string }
        displayName: { type: string, description: Empty when the account no longer exists. }
        regionPrefix:
          type: object
          required: [bundeslandNr, landkreisNr, shardNr, sellerNr]
          properties:
            bundeslandNr: { type: [integer, 'null'] }
            landkreisNr: { type: [integer, 'null'] }
            shardNr: { type: [integer, 'null'] }
            sellerNr: { type: [integer, 'null'] }
    MarketExportArticle:
      type: object
      description: Frozen markets export the printed label snapshot instead of the live article.
      required: [articleId, userId, codeFull, articleNr, labelRevision, fields]
      properties:
        articleId: { type: string }
        userId: { type: string }
        codeFull: { type: string }
        articleNr: { type: integer }
        labelRevision: { type: [integer, 'null'] }
        fields:
          type: object
          additionalProperties: { type: [string, number, 'null'] }
    MarketExportStammnummerMapping:
      type: object
      required: [stammnummer, userId, articleIds]
      properties:
        stammnummer: { type: integer }
        userId: { type: string }
        articleIds:
          type: array
          items: { type: string }
    MarketExportListing:
      type: object
      required: [listingId, articleId, sellerNumber, marketId, status, priceSnapshot, priceSnapshotCents, acceptedLabelRevision, freezeGeneration, exportGeneration]
      properties:
        listingId: { type: string }
        articleId: { type: string }
        sellerNumber: { type: integer }
        marketId: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ListingStatus' }
        priceSnapshot:
          type: [number, string, 'null']
          description: Euro value for older registers; `priceSnapshotCents` is authoritative when present.
        priceSnapshotCents: { type: [integer, 'null'], minimum: 0 }
        acceptedLabelRevision: { type: [integer, 'null'] }
        freezeGeneration: { type: [integer, 'null'] }
        exportGeneration: { type: [integer, 'null'] }
    MarketExportFieldProfileError:
      type: object
      required: [code, message, fieldProfileId, violations]
      properties:
        code: { type: string, enum: [field_profile_invalid] }
        message: { type: string }
        fieldProfileId: { type: string }
        violations:
          type: array
          items:
            type: object
            required: [code, message, fieldProfileId]
            properties:
              code: { type: string, enum: [price_field_missing, price_field_duplicate, price_field_wrong_type] }
              message: { type: string }
              fieldProfileId: { type: string }

    NotificationKind:
      type: string
      description: Waitlist promotion is prepared; its separate business workflow is not implemented by KAN-60.
      enum: [market_registration, waitlist_promoted, settlement_available, organization_admin]

    InAppNotification:
      type: object
      description: A server-authored personal event, without recipient identifiers or internal deduplication keys.
      required: [id, kind, title, message, actionLabel, href, createdAt]
      properties:
        id: { type: integer }
        kind:
          $ref: '#/components/schemas/NotificationKind'
        title: { type: string }
        message: { type: string }
        actionLabel: { type: string }
        href:
          type: string
          description: Internal dashboard destination selected by the server, never a client-supplied URL.
        organizationId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }

    NotificationPage:
      type: object
      required: [items, unreadCount, latestId, nextBeforeId]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InAppNotification'
        unreadCount: { type: integer, minimum: 0 }
        latestId:
          type: [integer, 'null']
          description: Latest own-account id, independent of the current filter or page cursor.
        nextBeforeId: { type: [integer, 'null'] }

    NotificationReadAllRequest:
      type: object
      additionalProperties: false
      required: [throughId]
      properties:
        throughId: { type: integer, minimum: 1 }

    SystemStatus:

      type: object

      properties:

        status:

          type: string

          enum: [ready, not_ready]

        database:

          type: string

          enum: [reachable, unreachable]

        environment:

          type: string

        appVersion:

          type: string

        buildSha:

          type: string

        openapiVersion:

          type: string

        openapiHash:

          type: string

      required: [status, database, environment, appVersion, buildSha, openapiVersion, openapiHash]

    UserRole:

      type: string

      description: Global account type. Operational permissions come from market roles and resource ownership.
      enum: [admin, user]

    AuthorizationErrorCode:

      type: string

      enum: [AUTH_MISSING, AUTH_INVALID, RBAC_FORBIDDEN, OWNERSHIP_REQUIRED]

    MarketRole:

      type: string

      enum: [organizer, cashier, helper]

    ArticleFieldType:

      type: string

      enum: [text, number, select, image]

    ListingStatus:

      type: string

      enum: [For Sale, Sold]

    OrgMemberRole:

      type: string

      enum: [Owner, Admin]

    ManagedOrganization:

      type: object

      description: Organization the authenticated user may manage, with the role that grants this right.

      required: [organizationId, name, role]

      properties:

        organizationId:

          type: string

        name:

          type: string

        role:

          $ref: '#/components/schemas/OrgMemberRole'

    OrganizationAdminAppointment:

      type: object

      description: One recorded appointment of an organization admin.

      required: [userId, appointedById, appointedAt]

      properties:

        userId:

          type: string

          description: User who received organization admin rights.

        appointedById:

          type: string

          description: User who granted the rights.

        appointedByName:

          type: string

          nullable: true

          description: Current display name of the granting user; null when the account no longer exists.

        appointedAt:

          type: string

          format: date-time

    MarketHistoryRole:

      type: string

      enum: [Seller, Helper, Organizer, Cashier]

    MarketStatus:

      type: string

      enum: [Active, Planning, Closed]

    MarketKind:
      type: string
      enum: [commission, table]

    MarketLifecyclePhase:
      type: string
      enum: [planning, participation_open, participation_closed, ready, live, post_processing, completed, cancelled]

    MarketLifecycleBlockerCode:
      type: string
      enum:
        - transition_not_allowed
        - configuration_incomplete
        - fees_not_configured
        - field_profile_missing
        - table_configuration_incomplete
        - market_not_frozen
        - open_sale_conflicts
        - settlement_not_finalized
        - settlement_outdated
        - cash_reconciliation_required

    MarketLifecycleBlocker:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/MarketLifecycleBlockerCode'
        message:
          type: string
        field:
          type: string
          nullable: true
      required: [code, message, field]

    MarketLifecycleTransitionPreview:
      type: object
      additionalProperties: false
      properties:
        marketId:
          type: integer
        currentPhase:
          $ref: '#/components/schemas/MarketLifecyclePhase'
        targetPhase:
          $ref: '#/components/schemas/MarketLifecyclePhase'
        allowed:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/MarketLifecycleBlocker'
        previewToken:
          type: string
      required: [marketId, currentPhase, targetPhase, allowed, blockers, previewToken]

    MarketLifecycleTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        targetPhase:
          $ref: '#/components/schemas/MarketLifecyclePhase'
        previewToken:
          type: string
          minLength: 1
      required: [targetPhase, previewToken]

    PublicMarketAvailabilityState:
      type: string
      enum: [announced, available, closed, preparing]

    RuecksortierVariante:

      type: string

      enum: [A, B]

    MarketFreezeState:

      type: string

      enum: [open, frozen]

    ZonenPlanZone:

      type: object

      properties:

        lineNumber:

          type: integer

          minimum: 1

        zoneNumber:

          type: integer

          minimum: 1

        sellerRangeStart:

          type: integer

          minimum: 1

          description: Lowest market-local Stammnummer assigned to this zone

        sellerRangeEnd:

          type: integer

          minimum: 1

          description: Highest market-local Stammnummer assigned to this zone

        sellerCount:

          type: integer

          minimum: 0

        rawSellerIds:

          type: array

          description: Market-local Stammnummern included in this zone; the field name is retained for compatibility

