          minimum: 1

          description: Number of label columns per printed page.

        gap:

          type: string

          description: CSS gap length between labels, e.g. "0.25cm".

        padding:

          type: string

          description: CSS padding length inside one label, e.g. "0.3cm".

        minHeight:

