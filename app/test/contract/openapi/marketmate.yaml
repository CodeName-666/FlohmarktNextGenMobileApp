            closed:

              type: integer

          required: [planning, active, closed]

        registeredSellers:

          type: integer

          description: Number of distinct users with at least one Stammnummer across the organization's markets.

        sellerNumbers:

          type: object

          description: Stammnummer capacity across all owned markets.

          properties:

            assigned:

              type: integer

            free:

              type: integer

            total:

              type: integer

          required: [assigned, free, total]

        articles:

