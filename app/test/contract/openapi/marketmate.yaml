        - organizationId
        - marketsByStatus
        - registeredSellers
        - sellerNumbers
        - articles
        - grossRevenueCents
        - openWorkload

    MarketStatistics:

      type: object

      description: Aggregated MVP statistics for one market (KAN-273).

      properties:

        marketId:

          type: integer

        marketName:

          type: string

        totalRegistrations:

          type: integer

        totalListings:

          type: integer

        soldArticles:

          type: integer

        unsoldArticles:

          type: integer

        grossRevenueCents:

          type: integer

        averageArticlePriceCents:

          type: integer

          nullable: true

          description: Average sold-article price in cents; null when nothing was sold.

        soldRatePercent:

          type: number

          nullable: true

          description: Share of listings sold (0..100); null when the market has no listings.

        revenueByHour:

          type: array

          description: Net sold revenue grouped by the hour of day the sale occurred (KAN-273 drill-down), sorted ascending by hour.

          items:

            $ref: '#/components/schemas/MarketRevenueHourPoint'

        topCategories:

          type: array

