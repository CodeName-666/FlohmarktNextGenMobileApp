    ListingStatusUpdateItem:

      type: object

      description: One requested listing status transition with optimistic locking.

      properties:

        listingId:

          type: string

          description: Stable listing identifier (`sellerNumber-articleId`).

        fromStatus:

          $ref: '#/components/schemas/ListingStatus'

        toStatus:

          $ref: '#/components/schemas/ListingStatus'

      required: [listingId, fromStatus, toStatus]

    ListingStatusUpdateRequest:

      type: object

      description: Bulk listing status update payload sent by the FlohmarktNextGenApp.

      properties:

        marketId:

          type: integer

          description: Target market identifier all updates belong to.

        updates:

          type: array

          minItems: 1

          description: |
            Requested status transitions. The server enforces an upper bound of 2000
            entries and responds with HTTP 413 when the limit is exceeded.

          items:

            $ref: '#/components/schemas/ListingStatusUpdateItem'

      required: [marketId, updates]

    ListingStatusResultCode:

      type: string

      enum: [ok, conflict, not_found]

      description: |
        Per-item outcome of one optimistic-locking status update.
        `ok` — listing now has `toStatus` (either applied or already there).
        `conflict` — current status does not match `fromStatus`; listing untouched.
        `not_found` — no listing with the requested id exists in the target market.

    ListingStatusResultItem:

      type: object

      properties:

        listingId:

          type: string

        result:

          $ref: '#/components/schemas/ListingStatusResultCode'

        currentStatus:

          allOf:

            - $ref: '#/components/schemas/ListingStatus'

          nullable: true

          description: Current persisted status after the operation. Omitted for `not_found`.

      required: [listingId, result]

    ListingStatusUpdateResult:

      type: object

      properties:

        marketId:

          type: integer

        items:

          type: array

          items:

            $ref: '#/components/schemas/ListingStatusResultItem'

      required: [marketId, items]

    BulkSaleItem:

      type: object

      description: One item line inside a bulk-imported sale transaction.

      properties:

        listingId:

          type: string

          description: Stable listing identifier (`sellerNumber-articleId`).

        priceSnapshot:

          type: number

          description: Price snapshot at the time of the sale, in the market currency (positive decimal).

        priceSnapshotCents:

          type: integer

          minimum: 0

          description: Exact frozen sale price in cents; required for frozen export generations.

        labelRevision:

          type: integer

          minimum: 1

          description: Revision encoded on the accepted physical article label.

      required: [listingId, priceSnapshot]

    BulkSale:

      type: object

      description: One sale transaction in a bulk-import payload.

      properties:

        vorgangId:

          type: string

          description: UUID v7 idempotency key persisted alongside the sale.

        occurredAt:

          type: string

          format: date-time

          description: Wall-clock timestamp of the sale, used downstream by the tie-breaker (BE-1B.6).

        kassenNummer:

          type: integer

          description: One-based cash-register number on the market.

        kundenNummer:

          type: integer

          description: One-based customer number issued by the cash register.

        geraeteId:

          type: string

          nullable: true

          description: Optional cash-register device identifier.

        items:

          type: array

          minItems: 1

          items:

            $ref: '#/components/schemas/BulkSaleItem'

        cancelOf:

          type: string

          nullable: true

          description: When set, references the `vorgangId` of an earlier sale that this entry cancels.

        cancelReason:

          type: string

          nullable: true

          maxLength: 1000

          description: Optional cashier-provided cancellation reason. Only valid with cancelOf; omitted, null or blank means not provided for compatibility with older cash registers.

      required: [vorgangId, occurredAt, kassenNummer, kundenNummer, items]

    BulkSaleRequest:

      type: object

      description: Bulk sale import payload sent by the FlohmarktNextGenApp after a market.

      properties:

        marketId:

          type: integer

          description: Target market identifier all sales belong to.

        exportGeneration:

          type: integer

          minimum: 1

          description: Frozen export generation used by every contributing cash register.

        sales:

          type: array

          minItems: 1

          description: Sale transactions to be persisted. Each entry is processed individually.

          items:

            $ref: '#/components/schemas/BulkSale'

      required: [marketId, sales]

    BulkSaleResultCode:

      type: string

      enum: [created, skipped_duplicate, conflict, invalid]

      description: |
        Per-item outcome of one bulk sale import.
        `created` — sale persisted.
        `skipped_duplicate` — `vorgangId` already known (idempotent retry).
        `conflict` — at least one `listingId` is already linked to another non-cancelled sale.
        `invalid` — payload violated a business rule (e.g. unknown `cancelOf`, listing not in market).

    BulkSaleResultItem:

      type: object

      properties:

        vorgangId:

          type: string

        result:

          $ref: '#/components/schemas/BulkSaleResultCode'

        message:

          type: string

          nullable: true

          description: Optional human-readable explanation, present for `invalid`/`conflict` outcomes.

        errorCode:

          type: string

          nullable: true

          description: >-
            Stable machine-readable domain error code. CANCEL_ORIGINAL_NOT_FOUND
            is retryable after the original event is delivered. CANCEL_ALREADY_CANCELLED,
            CANCEL_ITEMS_MISMATCH, CANCELLATION_INVALID and CANCEL_ORIGINAL_DISCARDED
            require manual review and must not be retried automatically.

        currentWinnerVorgangId:

          type: string

          nullable: true

          description: >-
            Vorgang identifier of the sale that won the `occurredAt` tie-breaker
            for the contested listing (BE-1B.6). Present for `conflict` outcomes.

        currentWinnerOccurredAt:

          type: string

          format: date-time

          nullable: true

          description: >-
            `occurredAt` of the tie-breaker winner, so the cashier can see why
            their vorgang was rejected (BE-1B.6). Present for `conflict` outcomes.

      required: [vorgangId, result]

    BulkSaleResult:

      type: object

      properties:

        marketId:

          type: integer

        items:

          type: array

          items:

            $ref: '#/components/schemas/BulkSaleResultItem'

      required: [marketId, items]

    SaleItem:

      type: object

      description: One persisted item line of a sale transaction.

      properties:

        listingId:

          type: string

          description: Stable listing identifier referenced by the sale item.

        priceSnapshot:

          type: number

          description: Price snapshot at sale time, in the market currency (positive decimal).

      required: [listingId, priceSnapshot]

    Sale:

      type: object

      description: One persisted cash-register sale transaction with its item lines (BE-1B.8).

      properties:

        vorgangId:

          type: string

          description: UUID v7 idempotency key of the sale.

        marketId:

          type: integer

          description: Market the sale belongs to.

        occurredAt:

          type: string

          format: date-time

          description: Wall-clock timestamp of the sale event.

        kassenNummer:

          type: integer

          description: One-based cash-register number on the market.

        kundenNummer:

          type: integer

          description: One-based customer number issued by the cash register.

        geraeteId:

          type: string

          nullable: true

          description: Optional cash-register device identifier.

        cancelOf:

          type: string

          nullable: true

          description: When set, references the `vorgangId` of the sale this entry cancels.

        cancelReason:

          type: string

          nullable: true

          maxLength: 1000

          description: Stored cancellation reason, or null when no reason was provided. Historical reasons are never inferred.

        channel:

          type: string

          description: Business sale channel value (e.g. `onsite`).

        recordingMode:

          type: string

          description: Technical recording mode (`offline_replay` for bulk-imported sales).

        items:

          type: array

          items:

            $ref: '#/components/schemas/SaleItem'

      required: [vorgangId, marketId, occurredAt, kassenNummer, kundenNummer, channel, recordingMode, items]

    SaleConflictType:

      type: string

      enum: [doppelverkauf, storno_mismatch, unerwarteter_verkauf, dublette]

      description: |
        Kind of the conflict the cashier referred to the organizer (Frage 13).
        `doppelverkauf` — two registers sold the same listing.
        `storno_mismatch` — a cancellation had no matching original.
        `unerwarteter_verkauf` — the sold listing was unknown to the backend.
        `dublette` — duplicate vorgang within one cash file.

    SaleConflictStatus:

      type: string

      enum: [open, resolved]

      description: Lifecycle status of a persisted sale conflict.

    SaleConflictResolution:

      type: string

      enum: [keep_a, keep_b, discard_both, keep_both_with_note]

      description: |
        Organizer's final decision on a sale conflict.
        `keep_a` — keep vorgang A, cancel persisted vorgang B.
        `keep_b` — keep vorgang B, cancel persisted vorgang A.
        `discard_both` — cancel both persisted vorgaenge.
        `keep_both_with_note` — keep both, only annotate with a note.

    RaiseSaleConflictRequest:

      type: object

      description: Payload sent by the app when a cashier refers a conflict to the organizer.

      properties:

        conflictType:

          $ref: '#/components/schemas/SaleConflictType'

        vorgangIdA:

          type: string

          description: Primary vorgang identifier involved in the conflict.

        vorgangIdB:

          type: string

          nullable: true

          description: Second vorgang identifier, when the conflict pairs two vorgaenge.

        listingId:

          type: string

          nullable: true

          description: Contested listing identifier, when the conflict is listing-bound.

        raisedByKasseNummer:

          type: integer

          description: Cash-register number that referred the conflict.

      required: [conflictType, vorgangIdA, raisedByKasseNummer]

    ResolveSaleConflictRequest:

      type: object

      description: Organizer's final decision on one open sale conflict.

      properties:

        resolution:

          $ref: '#/components/schemas/SaleConflictResolution'

        resolutionNote:

          type: string

          nullable: true

          description: Optional free-text note stored with the resolution.

      required: [resolution]

    SaleConflict:

      type: object

      description: One persisted sale conflict for the organizer dashboard (BE-1B.7).

      properties:

        details:
          description: Current transaction evidence in the organizer list; `null` when a conflict is created.
          anyOf:
            - $ref: '#/components/schemas/CashierConflict'
            - type: 'null'

        id:

          type: integer

        marketId:

          type: integer

        conflictType:

          $ref: '#/components/schemas/SaleConflictType'

        vorgangIdA:

          type: string

        vorgangIdB:

          type: string

          nullable: true

        listingId:

          type: string

          nullable: true

        raisedAt:

          type: string

          format: date-time

        raisedByKasseNummer:

          type: integer

        status:

          $ref: '#/components/schemas/SaleConflictStatus'

        resolvedAt:

          type: string

          format: date-time

          nullable: true

        resolvedByUserId:

          type: string

          nullable: true

        resolutionNote:

          type: string

          nullable: true

      required: [id, marketId, conflictType, vorgangIdA, raisedAt, raisedByKasseNummer, status]

    SaleConflictList:

      type: object

      properties:

        canResolve:
          type: boolean
          description: Whether the authenticated actor may resolve conflicts in this market.

        marketId:

          type: integer

        items:

          type: array

          items:

            $ref: '#/components/schemas/SaleConflict'

      required: [marketId, items]

    MarketSellerOverview:

      type: object

      properties:

        sellerNumber:

          type: integer

        userId:

          type: string

        userName:

          type: string

          nullable: true

        userEmail:

          type: string


          nullable: true

        sellerIdentityCode:

          type: string

          nullable: true

