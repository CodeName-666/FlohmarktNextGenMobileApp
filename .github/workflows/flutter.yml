name: Mobile checks and release preparation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Artifact contract tests
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -v

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build installable debug APK
        run: flutter build apk --debug
      - run: python3 ../scripts/collect_artifacts.py android debug-apk
      - name: Build unsigned release APK and Play bundle preparation
        if: github.ref == 'refs/heads/master'
        run: |
          flutter build apk --release
          python3 ../scripts/collect_artifacts.py android unsigned-apk
          flutter build appbundle --release
          python3 ../scripts/collect_artifacts.py android unsigned-aab
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMate-Android-preparation-${{ github.run_number }}
          path: build/android/
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify Apple toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" -ge 26
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug
      - run: python3 ../scripts/collect_artifacts.py ios simulator
      - name: Build unsigned device application
        if: github.ref == 'refs/heads/master'
        run: |
          flutter build ios --release --no-codesign
          python3 ../scripts/collect_artifacts.py ios unsigned-device
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMate-iOS-preparation-${{ github.run_number }}
          path: build/ios/
          if-no-files-found: error
          retention-days: 14

  signed-android:
    if: github.ref == 'refs/heads/master' && vars.MOBILE_ANDROID_SIGNING_ENABLED == 'true'
    needs: [checks, android]
    runs-on: ubuntu-latest
    environment: mobile-signing
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_APP_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare app signing key for directly distributed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}
        run: python3 ../scripts/prepare_android_signing.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release
      - name: Verify certificate and collect signed APK
        env:
          ANDROID_APP_CERT_SHA256: ${{ vars.ANDROID_APP_CERT_SHA256 }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          python3 ../scripts/verify_android_apk.py "$apksigner" build/app/outputs/flutter-apk/app-release.apk
          python3 ../scripts/collect_artifacts.py android signed-apk
      - name: Prepare separate Play upload key
        if: vars.MOBILE_ANDROID_UPLOAD_SIGNING_ENABLED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: python3 ../scripts/prepare_android_signing.py
      - name: Build Play upload bundle
        if: vars.MOBILE_ANDROID_UPLOAD_SIGNING_ENABLED == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          verification="$(jarsigner -verify build/app/outputs/bundle/release/app-release.aab)"
          printf '%s\n' "$verification"
          # jarsigner can exit successfully for an unsigned archive, so require its positive verdict.
          [[ "$verification" == *"jar verified."* ]]
          python3 ../scripts/collect_artifacts.py android upload-aab
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMate-Android-signed-${{ github.run_number }}
          path: build/android/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/marketmate-signing.jks"

  publish-android:
    if: github.ref == 'refs/heads/master' && vars.MOBILE_SERVER_PUBLISH_ENABLED == 'true' && vars.MOBILE_SERVER_CONTRACT_READY == 'true'
    needs: [signed-android, ios]
    runs-on: ubuntu-latest
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MarketMate-Android-signed-${{ github.run_number }}
          path: build/android/
      - name: Publish verified APK through mobile-only server command
        working-directory: .
        env:
          MOBILE_SERVER_PUBLISH_ENABLED: ${{ vars.MOBILE_SERVER_PUBLISH_ENABLED }}
          MOBILE_SERVER_CONTRACT_READY: ${{ vars.MOBILE_SERVER_CONTRACT_READY }}
          MARKETMATE_VPS_HOST: ${{ secrets.MARKETMATE_VPS_HOST }}
          MARKETMATE_MOBILE_RELEASES_SSH_USER: ${{ secrets.MARKETMATE_MOBILE_RELEASES_SSH_USER }}
          MARKETMATE_MOBILE_RELEASES_SSH_KEY: ${{ secrets.MARKETMATE_MOBILE_RELEASES_SSH_KEY }}
          MARKETMATE_MOBILE_RELEASES_KNOWN_HOSTS: ${{ secrets.MARKETMATE_MOBILE_RELEASES_KNOWN_HOSTS }}
          ANDROID_APP_CERT_SHA256: ${{ vars.ANDROID_APP_CERT_SHA256 }}
        run: |
          export APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          python3 scripts/publish_android.py
